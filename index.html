<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EDUROUTE — Smart Education Platform" />
    <title>EDUROUTE | Smart Education Platform</title>
    <!-- Brand icon: open book + learning path + destination marker -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0B204A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme (or dark default) before paint — avoids light-mode flash
      (function () {
        try {
          var t = localStorage.getItem('eduroute-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <style>
      /* Minimal shell — default dark so failed JS never flashes light */
      html, body { margin: 0; min-height: 100%; background: #0b1120; color: #f1f5f9; font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, sans-serif; }
      #root { min-height: 100vh; }
      #boot-fallback { display: none; max-width: 28rem; margin: 4rem auto; padding: 1.5rem; text-align: center; }
      #boot-fallback.show { display: block; }
      #boot-fallback a { color: #a78bfa; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert">
      <p style="font-size:1.25rem;font-weight:800;margin:0 0 0.5rem">EDUROUTE</p>
      <p style="color:#94a3b8;margin:0 0 1rem">Something went wrong loading the app.</p>
      <a href="/">Reload</a>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          var fb = document.getElementById('boot-fallback');
          if (fb) fb.classList.add('show');
        }
      }, 8000);
    </script>
  </body>
</html>
