# EDUROUTE Netlify — hybrid DB sync (Neon via Go on Render)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose", "mysql2", "bcryptjs", "nodemailer"]

# Auth → dedicated proxies
[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login/student"
  to = "/.netlify/functions/auth-login-student"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login/staff"
  to = "/.netlify/functions/auth-login-staff"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/oauth/github"
  to = "/.netlify/functions/auth-oauth-github"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/oauth/linkedin"
  to = "/.netlify/functions/auth-oauth-linkedin"
  status = 200
  force = true

# Neon-backed routes → Go proxy (GO_API_URL / BACKEND_URL on Netlify)
[[redirects]]
  from = "/api/ai-courses"
  to = "/.netlify/functions/go-api?path=/api/ai-courses"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-courses/*"
  to = "/.netlify/functions/go-api?path=/api/ai-courses/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/buddy/conversations"
  to = "/.netlify/functions/go-api?path=/api/buddy/conversations"
  status = 200
  force = true

[[redirects]]
  from = "/api/buddy/conversations/*"
  to = "/.netlify/functions/go-api?path=/api/buddy/conversations/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/buddy/chat"
  to = "/.netlify/functions/go-api?path=/api/buddy/chat"
  status = 200
  force = true

# Other API → Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
