# EDUROUTE Netlify — Render (Neon) + Supabase only.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mysql2", "bcryptjs", "nodemailer"]

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login/student"
  to = "/.netlify/functions/auth-login-student"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login/staff"
  to = "/.netlify/functions/auth-login-staff"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/oauth/github"
  to = "/.netlify/functions/auth-oauth-github"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/oauth/linkedin"
  to = "/.netlify/functions/auth-oauth-linkedin"
  status = 200
  force = true

# Buddy sync → dedicated function (avoids /api/* splat 404)
[[redirects]]
  from = "/api/buddy/sync"
  to = "/.netlify/functions/buddy-sync"
  status = 200
  force = true

# Neon via Go — set GO_API_URL=https://eduroute-api-nho4.onrender.com
[[redirects]]
  from = "/api/ai-courses"
  to = "/.netlify/functions/go-api"
  status = 200
  force = true
  query = { path = "/api/ai-courses" }

[[redirects]]
  from = "/api/buddy/conversations"
  to = "/.netlify/functions/go-api"
  status = 200
  force = true
  query = { path = "/api/buddy/conversations" }

[[redirects]]
  from = "/api/buddy/chat"
  to = "/.netlify/functions/go-api"
  status = 200
  force = true
  query = { path = "/api/buddy/chat" }

[[redirects]]
  from = "/api/buddy-progress"
  to = "/.netlify/functions/buddy-progress"
  status = 200
  force = true

[[redirects]]
  from = "/api/buddy-chat"
  to = "/.netlify/functions/buddy-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
